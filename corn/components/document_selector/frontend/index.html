<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Selector</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #ffffff;
        color: #111827;
      }

      #container {
        box-sizing: border-box;
        min-height: 320px;
        overflow-y: auto;
        padding: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        line-height: 1.6;
        white-space: pre-wrap;
        user-select: text;
        resize: vertical;
      }

      #container::selection {
        background: #fde68a;
      }

      mark.persisted-highlight {
        color: inherit;
        padding: 0;
        border-radius: 0.125rem;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        cursor: pointer;
      }

      mark.persisted-highlight.focused-highlight {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }

      #tooltip {
        position: fixed;
        z-index: 1000;
        max-width: 24rem;
        display: none;
        pointer-events: none;
        background: rgba(17, 24, 39, 0.96);
        color: #f9fafb;
        border-radius: 0.5rem;
        padding: 0.75rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.28);
        font-size: 0.875rem;
        line-height: 1.45;
      }

      #tooltip[data-visible="true"] {
        display: block;
      }

      #selection-action {
        position: fixed;
        z-index: 1001;
        display: none;
        gap: 0.5rem;
        align-items: center;
        background: rgba(17, 24, 39, 0.96);
        color: #f9fafb;
        border-radius: 999px;
        padding: 0.375rem 0.5rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.28);
      }

      #selection-action[data-visible="true"] {
        display: inline-flex;
      }

      #selection-action button {
        border: 0;
        border-radius: 999px;
        background: #f59e0b;
        color: #111827;
        font-weight: 600;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }

      #selection-action button:hover {
        background: #fbbf24;
      }

      #selection-action button.secondary {
        background: transparent;
        color: #f9fafb;
      }

      .tooltip-title {
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .tooltip-list {
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
      }

      .tooltip-item {
        padding-top: 0.625rem;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }

      .tooltip-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .tooltip-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }

      .tooltip-swatch {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 999px;
        flex: 0 0 auto;
      }

      .tooltip-heading {
        font-weight: 600;
      }

      .tooltip-type {
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="tooltip" aria-hidden="true"></div>
    <div id="selection-action" aria-hidden="true">
      <button id="selection-action-button" type="button"></button>
      <button id="selection-cancel-button" class="secondary" type="button">Dismiss</button>
    </div>
    <script>
      const container = document.getElementById("container");
      const tooltip = document.getElementById("tooltip");
      const selectionAction = document.getElementById("selection-action");
      const selectionActionButton = document.getElementById("selection-action-button");
      const selectionCancelButton = document.getElementById("selection-cancel-button");
      let currentText = "";
      let currentHighlights = [];
      let resizeObserver = null;
      let lastFocusNonce = null;
      let clearFocusedHighlightTimer = null;
      let pendingSelectionPayload = null;
      let currentSelectionMode = "create_entry";

      function sendMessage(type, payload = {}) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type,
            ...payload,
          },
          "*",
        );
      }

      function setFrameHeight() {
        sendMessage("streamlit:setFrameHeight", {
          height: document.documentElement.scrollHeight,
        });
      }

      function appendTextNode(text) {
        if (!text) {
          return;
        }
        container.appendChild(document.createTextNode(text));
      }

      function normalizeHighlights(highlights, textLength) {
        if (!Array.isArray(highlights)) {
          return [];
        }

        const normalized = [];
        for (const highlight of highlights) {
          const start = Number(highlight?.start);
          const end = Number(highlight?.end);
          if (!Number.isInteger(start) || !Number.isInteger(end)) {
            continue;
          }
          if (start < 0 || end <= start || start >= textLength) {
            continue;
          }
          const color = typeof highlight?.color === "string" && highlight.color.trim()
            ? highlight.color.trim()
            : "#fde68a";
          normalized.push({
            start,
            end: Math.min(end, textLength),
            color,
            annotations: Array.isArray(highlight?.annotations) ? highlight.annotations : [],
          });
        }

        normalized.sort(
          (left, right) =>
            left.start - right.start || left.end - right.end || left.color.localeCompare(right.color),
        );
        return normalized;
      }

      function buildHighlightSegments(highlights, textLength) {
        if (!highlights.length) {
          return [];
        }

        const boundaries = new Set([0, textLength]);
        for (const highlight of highlights) {
          boundaries.add(highlight.start);
          boundaries.add(highlight.end);
        }

        const orderedBoundaries = Array.from(boundaries).sort((left, right) => left - right);
        const segments = [];
        for (let index = 0; index < orderedBoundaries.length - 1; index += 1) {
          const start = orderedBoundaries[index];
          const end = orderedBoundaries[index + 1];
          if (end <= start) {
            continue;
          }

          const activeHighlights = highlights.filter(
            (highlight) => highlight.start < end && highlight.end > start,
          );
          const activeColors = activeHighlights.map((highlight) => highlight.color);
          if (!activeColors.length) {
            continue;
          }

          const colors = Array.from(new Set(activeColors));
          const annotations = [];
          const seenAnnotations = new Set();
          for (const highlight of activeHighlights) {
            for (const annotation of highlight.annotations) {
              const annotationKey = JSON.stringify(annotation);
              if (seenAnnotations.has(annotationKey)) {
                continue;
              }
              seenAnnotations.add(annotationKey);
              annotations.push(annotation);
            }
          }
          const previous = segments.at(-1);
          if (
            previous &&
            previous.end === start &&
            previous.colors.length === colors.length &&
            previous.colors.every((color, colorIndex) => color === colors[colorIndex]) &&
            previous.annotations.length === annotations.length &&
            previous.annotations.every(
              (annotation, annotationIndex) =>
                JSON.stringify(annotation) === JSON.stringify(annotations[annotationIndex]),
            )
          ) {
            previous.end = end;
            continue;
          }
          segments.push({ start, end, colors, annotations });
        }
        return segments;
      }

      function backgroundStyle(colors) {
        if (colors.length === 1) {
          return colors[0];
        }

        const stripes = [];
        const stripeWidth = 100 / colors.length;
        colors.forEach((color, index) => {
          const start = stripeWidth * index;
          const end = stripeWidth * (index + 1);
          stripes.push(`${color} ${start}% ${end}%`);
        });
        return `linear-gradient(135deg, ${stripes.join(", ")})`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll("\"", "&quot;")
          .replaceAll("'", "&#39;");
      }

      function tooltipContent(annotations) {
        const countLabel = annotations.length === 1 ? "1 annotation" : `${annotations.length} annotations`;
        const items = annotations
          .map((annotation) => {
            const source = escapeHtml(annotation.source || "Unknown source");
            const target = escapeHtml(annotation.target || "Unknown target");
            const tieType = escapeHtml(annotation.type || "Unspecified tie");
            const safeColor = annotation.color || "#fde68a";
            return `
              <div class="tooltip-item">
                <div class="tooltip-meta">
                  <span class="tooltip-swatch" style="background: ${safeColor};"></span>
                  <span class="tooltip-heading">${source} → ${target}</span>
                </div>
                <div class="tooltip-type">${tieType}</div>
              </div>
            `;
          })
          .join("");
        return `
          <div class="tooltip-title">${escapeHtml(countLabel)}</div>
          <div class="tooltip-list">${items}</div>
        `;
      }

      function positionTooltip(clientX, clientY) {
        const offset = 14;
        const tooltipWidth = tooltip.offsetWidth;
        const tooltipHeight = tooltip.offsetHeight;
        const maxLeft = window.innerWidth - tooltipWidth - 8;
        const maxTop = window.innerHeight - tooltipHeight - 8;
        const left = Math.min(clientX + offset, Math.max(8, maxLeft));
        const top = Math.min(clientY + offset, Math.max(8, maxTop));
        tooltip.style.left = `${left}px`;
        tooltip.style.top = `${top}px`;
      }

      function showTooltip(segment, clientX, clientY) {
        if (!segment.annotations.length) {
          hideTooltip();
          return;
        }
        tooltip.innerHTML = tooltipContent(segment.annotations);
        tooltip.dataset.visible = "true";
        tooltip.setAttribute("aria-hidden", "false");
        positionTooltip(clientX, clientY);
      }

      function hideTooltip() {
        tooltip.dataset.visible = "false";
        tooltip.setAttribute("aria-hidden", "true");
        tooltip.innerHTML = "";
      }

      function hideSelectionAction(clearBrowserSelection = false) {
        selectionAction.dataset.visible = "false";
        selectionAction.setAttribute("aria-hidden", "true");
        pendingSelectionPayload = null;
        if (clearBrowserSelection) {
          const selection = window.getSelection();
          if (selection) {
            selection.removeAllRanges();
          }
        }
      }

      function positionSelectionAction(rect) {
        const width = selectionAction.offsetWidth || 160;
        const height = selectionAction.offsetHeight || 40;
        const left = Math.min(
          Math.max(8, rect.left + window.scrollX),
          window.innerWidth + window.scrollX - width - 8,
        );
        const top = Math.max(8, rect.top + window.scrollY - height - 8);
        selectionAction.style.left = `${left}px`;
        selectionAction.style.top = `${top}px`;
      }

      function showSelectionAction(payload, range) {
        pendingSelectionPayload = payload;
        selectionActionButton.textContent =
          currentSelectionMode === "capture_span" ? "Use selected span" : "Create annotation entry";
        selectionAction.dataset.visible = "true";
        selectionAction.setAttribute("aria-hidden", "false");
        positionSelectionAction(range.getBoundingClientRect());
      }

      function clearFocusedHighlight() {
        if (clearFocusedHighlightTimer) {
          window.clearTimeout(clearFocusedHighlightTimer);
          clearFocusedHighlightTimer = null;
        }
        container
          .querySelectorAll("mark.persisted-highlight.focused-highlight")
          .forEach((mark) => mark.classList.remove("focused-highlight"));
      }

      function focusHighlight(focusRequest) {
        if (!focusRequest || !focusRequest.nonce || focusRequest.nonce === lastFocusNonce) {
          return;
        }

        const start = Number(focusRequest.start);
        const end = Number(focusRequest.end);
        if (!Number.isInteger(start) || !Number.isInteger(end) || end <= start) {
          return;
        }

        const marks = Array.from(container.querySelectorAll("mark.persisted-highlight"));
        const targetMark = marks.find((mark) => {
          const markStart = Number(mark.dataset.start);
          const markEnd = Number(mark.dataset.end);
          return Number.isInteger(markStart) && Number.isInteger(markEnd) && markStart < end && markEnd > start;
        });
        if (!targetMark) {
          return;
        }

        lastFocusNonce = focusRequest.nonce;
        hideTooltip();
        clearFocusedHighlight();
        targetMark.classList.add("focused-highlight");
        targetMark.scrollIntoView({ behavior: "smooth", block: "center" });
        clearFocusedHighlightTimer = window.setTimeout(() => {
          targetMark.classList.remove("focused-highlight");
          clearFocusedHighlightTimer = null;
        }, 1800);
      }

      function render(text, highlights, focusRequest) {
        currentText = text || "";
        currentHighlights = normalizeHighlights(highlights, currentText.length);
        const highlightSegments = buildHighlightSegments(currentHighlights, currentText.length);
        container.replaceChildren();
        hideTooltip();
        hideSelectionAction();

        let cursor = 0;
        for (const segment of highlightSegments) {
          appendTextNode(currentText.slice(cursor, segment.start));
          const mark = document.createElement("mark");
          mark.className = "persisted-highlight";
          mark.style.background = backgroundStyle(segment.colors);
          mark.textContent = currentText.slice(segment.start, segment.end);
          mark.dataset.start = String(segment.start);
          mark.dataset.end = String(segment.end);
          mark.addEventListener("mouseenter", (event) => {
            showTooltip(segment, event.clientX, event.clientY);
          });
          mark.addEventListener("mousemove", (event) => {
            if (tooltip.dataset.visible === "true") {
              positionTooltip(event.clientX, event.clientY);
            }
          });
          mark.addEventListener("mouseleave", hideTooltip);
          container.appendChild(mark);
          cursor = segment.end;
        }
        appendTextNode(currentText.slice(cursor));
        setFrameHeight();
        focusHighlight(focusRequest);
      }

      function applyHeight(height) {
        const parsedHeight = Number(height);
        container.style.height = `${Number.isFinite(parsedHeight) ? parsedHeight : 420}px`;
      }

      function getSelectionPayload() {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0) {
          return null;
        }

        const range = selection.getRangeAt(0);
        if (!container.contains(range.commonAncestorContainer)) {
          return null;
        }

        const selectedText = selection.toString();
        if (!selectedText.trim()) {
          return null;
        }

        const prefixRange = range.cloneRange();
        prefixRange.selectNodeContents(container);
        prefixRange.setEnd(range.startContainer, range.startOffset);
        const start = prefixRange.toString().length;
        const end = start + selectedText.length;

        return {
          text: selectedText,
          start,
          end,
          nonce: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        };
      }

      function handleSelectionChange() {
        const selection = window.getSelection();
        if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
          hideSelectionAction();
          return;
        }
        const range = selection.getRangeAt(0);
        const payload = getSelectionPayload();
        if (!payload) {
          hideSelectionAction();
          return;
        }
        showSelectionAction(payload, range);
      }

      function emitSelectionAction() {
        if (!pendingSelectionPayload) {
          return;
        }
        sendMessage("streamlit:setComponentValue", {
          value: {
            ...pendingSelectionPayload,
            action: currentSelectionMode === "capture_span" ? "use_selected_span" : "create_annotation_entry",
          },
        });
        hideSelectionAction(true);
      }

      window.addEventListener("message", (event) => {
        if (event.data.type !== "streamlit:render") {
          return;
        }
        applyHeight(event.data.args.height);
        currentSelectionMode = event.data.args.selection_mode || "create_entry";
        render(event.data.args.text, event.data.args.highlights, event.data.args.focus_request);
      });

      window.addEventListener("load", () => {
        sendMessage("streamlit:componentReady", { apiVersion: 1 });
        resizeObserver = new ResizeObserver(() => {
          setFrameHeight();
        });
        resizeObserver.observe(container);
        setFrameHeight();
      });

      document.addEventListener("mouseup", handleSelectionChange);
      document.addEventListener("keyup", handleSelectionChange);
      container.addEventListener("scroll", hideTooltip);
      container.addEventListener("scroll", () => hideSelectionAction());
      window.addEventListener("resize", setFrameHeight);
      window.addEventListener("blur", hideTooltip);
      selectionActionButton.addEventListener("click", emitSelectionAction);
      selectionCancelButton.addEventListener("click", () => hideSelectionAction(true));
    </script>
  </body>
</html>
