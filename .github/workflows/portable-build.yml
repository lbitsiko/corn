name: Portable builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/portable-build.yml"
      - "app.py"
      - "corn/**"
      - "logos/**"
      - "packaging/**"
      - "requirements*.txt"
      - "tests/test_app_paths.py"
      - "tests/test_desktop_*.py"
      - "tests/test_launcher.py"
      - "tests/test_packaging_manifest.py"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CORN-windows-x64
            executable: dist/CORN/CORN.exe
          - os: macos-14
            artifact: CORN-macos-arm64
            executable: dist/CORN/CORN
          - os: ubuntu-22.04
            artifact: CORN-linux-x64
            executable: dist/CORN/CORN

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Verify target architecture
        shell: bash
        run: |
          python -c "import platform; print(platform.platform(), platform.machine())"
          if [[ "${{ matrix.artifact }}" == "CORN-macos-arm64" ]]; then
            python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Verify Tkinter
        run: python -c "import tkinter; print(tkinter.TkVersion)"

      - name: Run tests
        run: python -m pytest -q

      - name: Build portable bundle
        run: pyinstaller --clean --noconfirm packaging/corn.spec

      - name: Verify portable bundle
        run: python packaging/verify_bundle.py "${{ matrix.executable }}"

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CORN -DestinationPath "${{ matrix.artifact }}.zip"
          $hash = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File "${{ matrix.artifact }}.zip.sha256" -Encoding ascii

      - name: Archive macOS bundle
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/CORN "${{ matrix.artifact }}.zip"
          shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"

      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist CORN
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"

      - name: Upload portable archive
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download portable archives
        uses: actions/download-artifact@v6
        with:
          pattern: CORN-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"
