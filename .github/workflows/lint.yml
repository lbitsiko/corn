name: Lint

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-python:
    name: Portable desktop Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check portable desktop Python
        run: |
          files=(
            corn/app_paths.py
            corn/demo_project.py
            corn/desktop.py
            corn/desktop_runtime.py
            corn/launcher.py
            corn/llm_worker.py
            corn/packaging_manifest.py
            corn_desktop.py
            packaging/verify_bundle.py
            tests/test_app_paths.py
            tests/test_demo_project.py
            tests/test_desktop_entrypoint.py
            tests/test_desktop_runtime.py
            tests/test_launcher.py
            tests/test_llm_worker.py
            tests/test_packaging_manifest.py
          )
          ruff check --select E4,E7,E9,F "${files[@]}"
          ruff format --check "${files[@]}"
